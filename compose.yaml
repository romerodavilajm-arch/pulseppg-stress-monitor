
# PulsePPG Stress Monitor — compose de las fases 1 a 10.
# PostgreSQL, servidor-web, watcher, spark y modelo (efímeros) y un simulador
# de la Pi.

name: pulseppg

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseppg}
      POSTGRES_USER: ${POSTGRES_USER:-pulseppg}
      # Red local sin autenticación en el alcance; se puede sobrescribir con un .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseppg}
    volumes:
      # Volumen nombrado: los datos sobreviven a "down" y a reinicios.
      - pgdata:/var/lib/postgresql/data
      # init.sql solo se ejecuta cuando el volumen está vacío (primer arranque).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Sin "ports": los demás contenedores llegan por la red interna de compose
    # (host "postgres", puerto 5432). Para inspeccionar a mano:
    #   docker compose exec postgres psql -U pulseppg -d pulseppg
    healthcheck:
      # Se consulta por TCP (-h 127.0.0.1) a propósito: durante la inicialización
      # la imagen levanta un servidor temporal solo por socket Unix, así que el
      # contenedor no se marca "healthy" hasta que init.sql terminó y arrancó el
      # servidor definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  servidor-web:
    build: ./servidor-web
    restart: unless-stopped
    environment:
      # Solo lee: estado, resultados y últimas sesiones para la pantalla.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseppg}:${POSTGRES_PASSWORD:-pulseppg}@postgres:5432/${POSTGRES_DB:-pulseppg}
    # Único puerto publicado: el navegador y la Pi real llegan por aquí.
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  # Recibe el JSONL por POST /upload, verifica el SHA-256 y lo deja en
  # /data/raw/ con la sesión en 'uploaded'. Un watchdog vigila esa carpeta y
  # por cada archivo nuevo lanza un contenedor efímero de spark y luego uno de
  # modelo. Con la sesión en 'ready' borra el crudo y conserva solo las 10
  # sesiones más recientes (MAX_SESSIONS). Para ver los archivos:
  #   docker compose exec watcher ls -l /data/raw
  watcher:
    build: ./watcher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseppg}:${POSTGRES_PASSWORD:-pulseppg}@postgres:5432/${POSTGRES_DB:-pulseppg}
      SPARK_IMAGE: pulseppg-spark
      MODELO_IMAGE: pulseppg-modelo
    # Publicado para que la Pi real pueda subir desde la red local.
    ports:
      - "5001:5001"
    volumes:
      # Mismo volumen que leen spark y modelo.
      - rawdata:/data/raw
      # Para lanzar spark y modelo como contenedores hermanos ("compose run
      # --rm spark" de la propuesta). Da al watcher control sobre Docker: aceptable en una
      # PC de demo en red local, no en un servidor compartido.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      # "compose up" construye las imágenes de spark y modelo y comprueba que
      # arrancan antes de que el watcher pueda lanzarlas.
      spark:
        condition: service_completed_successfully
      modelo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Efímero: no queda corriendo. En "compose up" solo verifica la imagen y
  # termina; el watcher lo lanza por sesión con
  #   python3 /app/hrv.py /data/raw/<session_id>.jsonl <session_pk>
  # A mano, sobre un archivo que ya esté en /data/raw/:
  #   docker compose run --rm spark python3 /app/hrv.py /data/raw/<id>.jsonl <pk>
  spark:
    build: ./spark
    # Nombre fijo para que el watcher lance esta misma imagen.
    image: pulseppg-spark
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseppg}:${POSTGRES_PASSWORD:-pulseppg}@postgres:5432/${POSTGRES_DB:-pulseppg}
    volumes:
      - rawdata:/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Efímero, como spark. En "compose up" comprueba que los pesos de Pulse-PPG
  # cargan (y avisa si falta el clasificador) y termina; el watcher lo lanza
  # por sesión después de spark con
  #   python3 /app/infer.py /data/raw/<session_id>.jsonl <session_pk>
  # A mano, sobre un archivo que ya esté en /data/raw/:
  #   docker compose run --rm modelo python3 /app/infer.py /data/raw/<id>.jsonl --no-db
  modelo:
    # El build instala PyTorch (CPU) y descarga los pesos de Zenodo.
    build: ./modelo
    # Nombre fijo para que el watcher lance esta misma imagen.
    image: pulseppg-modelo
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseppg}:${POSTGRES_PASSWORD:-pulseppg}@postgres:5432/${POSTGRES_DB:-pulseppg}
    volumes:
      - rawdata:/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Hace de Pi mientras no hay hardware: se registra en servidor-web, emite
  # samples sintéticos al recibir "start", escribe el JSONL y lo sube al
  # watcher. Para usar la Pi real:
  #   docker compose up -d postgres servidor-web watcher
  simulador-pi:
    build:
      context: ./simulador
      # writer.py y transfer.py se copian desde pi/: mismo código que la Pi real.
      additional_contexts:
        pi: ./pi
    restart: unless-stopped
    environment:
      SERVER_URL: http://servidor-web:5000
      WATCHER_URL: http://watcher:5001
      DURATION_SEC: ${SIM_DURATION_SEC:-300}
    depends_on:
      servidor-web:
        condition: service_healthy
      watcher:
        condition: service_healthy

volumes:
  pgdata:
  rawdata:
